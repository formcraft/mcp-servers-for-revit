<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Formcraft tools</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FEB}a:hover{color:#1556BD}
</style>
</helmet>
<div style="width: 1440px; height: 810px; box-sizing: border-box; padding: 40px 56px; background: #F6F7F9; color: #1A1D21; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #4A515C">New tools</div>
    <h2 style="margin: 8px 0 0; font-size: 36px; line-height: 1.08; font-weight: 700; letter-spacing: -1px">Five guarded tools: each one a kit script Claude can run</h2>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; flex-grow: 1; min-height: 0">
    <sc-for list="{{tools}}" as="t" hint-placeholder-count="5">
      <div style="background: #FFFFFF; border: 1px solid #DDE1E6; border-top: 4px solid {{t.color}}; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; color: #1556BD">{{t.name}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 2px 7px; border-radius: 10px; background: #EEF0F3; color: #3B424D; white-space: nowrap">{{t.phase}}</span>
        </div>
        <div style="font-size: 15px; font-weight: 600; line-height: 1.35">{{t.does}}</div>
        <div>
          <div style="font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: #5B6270">Actions</div>
          <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px">
            <sc-for list="{{t.actions}}" as="a" hint-placeholder-count="5">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 2px 6px; border-radius: 4px; background: #F1F5FE; color: #1556BD">{{a.name}}</span>
            </sc-for>
          </div>
        </div>
        <div>
          <div style="font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: #5B6270">Runs on</div>
          <div style="margin-top: 4px; font-size: 13px; line-height: 1.4; color: {{t.runsFg}}">{{t.runs}}</div>
        </div>
        <div>
          <div style="font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: #5B6270">Replaces</div>
          <div style="margin-top: 4px; font-size: 13px; line-height: 1.45; color: #3B424D">{{t.replaces}}</div>
        </div>
        <div style="margin-top: auto; padding-top: 8px; border-top: 1px solid #EEF0F3; font-size: 12.5px; line-height: 1.4; color: #6B4100">{{t.human}}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: stretch; gap: 0">
    <sc-for list="{{pattern}}" as="p" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; flex: 1">
        <div style="flex: 1; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; background: {{p.bg}}; border: 1px solid {{p.border}}">
          <div style="font-size: 14.5px; font-weight: 600; color: {{p.fg}}">{{p.title}}</div>
          <div style="font-size: 12.5px; line-height: 1.4; color: {{p.body}}">{{p.text}}</div>
        </div>
        <sc-if value="{{p.arrow}}" hint-placeholder-val="{{true}}">
          <svg width="26" height="20" viewBox="0 0 26 20" aria-hidden="true"><path d="M2 10 H22 M16 4 L22 10 L16 16" fill="none" stroke="#8A919C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
renderVals() {
const A = (list) => list.map((name) => ({ name }));
const read = '#1E6B34', setup = '#1A1D21';
const tools = [
{ name: 'fmc_qa', phase: '5 · M', color: '#1E8E3E', does: 'One QA report against the Manual', actions: A(['naming', 'bindings', 'keynotes', 'links', 'health', 'sheets', 'ids']), runs: 'Every model, live projects included. Read-only.', runsFg: read, replaces: 'FMC_ModelHealth · 3_SheetQA · 4_ProjectMetrics · fmc_name_check.py', human: 'People decide what to fix; the report goes to FMC_Reports.' },
{ name: 'fmc_project', phase: '4 · M', color: '#1F6FEB', does: 'Starts a project from your folder', actions: A(['start', 'project_info', 'models', 'families']), runs: 'Your project folder (D5) and new models. Dry run first.', runsFg: setup, replaces: 'fmc_new_project.py · setting project data by hand', human: 'Demand factors and load settings stay with the electrical engineer.' },
{ name: 'fmc_sync', phase: '6 · S', color: '#1F6FEB', does: 'Pushes master data and keynotes into types', actions: A(['preview', 'master_data', 'keynotes']), runs: 'Templates and new projects; shared models with your toggle on. Preview everywhere.', runsFg: setup, replaces: 'FMC_SyncMasterData (Dynamo)', human: 'A new keynote code is a change request to the kit, not a sync.' },
{ name: 'fmc_link', phase: '4 · M', color: '#1F6FEB', does: 'Links discipline and consultant models the Manual way', actions: A(['link', 'pin', 'workset', 'audit']), runs: 'New projects. Audit on every model.', runsFg: setup, replaces: 'Manual 8.5 steps done by hand', human: 'Acquire and publish coordinates stay with the BIM Coordinator.' },
{ name: 'fmc_template', phase: '2 · L', color: '#1F6FEB', does: 'Builds the compliant Base and 12 role templates', actions: A(['bind_parameters', 'keynote_file', 'view_templates', 'filters', 'schedules', 'sheets', 'electrical']), runs: 'Templates in 06_Templates\\_Staging only.', runsFg: setup, replaces: 'FMC_BindSharedParameters · 1_SetupElectrical · 2_CreateSheets · template edits by hand', human: 'Publishing a template to 06_Templates is a gate with a named approver.' }
];
const P = (title, text) => ({ title, text, bg: '#FFFFFF', border: '#DDE1E6', fg: '#1A1D21', body: '#3B424D', arrow: true });
const pattern = [
P('Kit data', 'Registers, dictionary, keynotes: the single source'),
P('Server check', 'Names, folders, lock class, dictionary'),
P('Dry run', 'Shown to you before anything changes'),
P('Revit handler', 'One transaction on the main thread'),
Object.assign(P('Log and report', 'FMC_MCP_FileLog.csv and FMC_Reports'), { arrow: false })
];
return { tools, pattern };
}
}
</script>
</body>
</html>
