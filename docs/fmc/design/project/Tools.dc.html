<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tools Claude sees</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FEB}a:hover{color:#1556BD}
</style>
</helmet>
<div style="width: 1440px; height: 810px; box-sizing: border-box; padding: 40px 56px; background: #F6F7F9; color: #1A1D21; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #4A515C">Tools</div>
    <h2 style="margin: 8px 0 0; font-size: 36px; line-height: 1.08; font-weight: 700; letter-spacing: -1px">What Claude can call, and what guards each one</h2>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; flex-grow: 1; min-height: 0">
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border: 1px solid #DDE1E6; border-top: 4px solid {{c.color}}; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 18px; font-weight: 700">{{c.title}}</div>
        <div style="font-size: 13.5px; line-height: 1.45; color: #3B424D">{{c.rule}}</div>
        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
          <sc-for list="{{c.items}}" as="i" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; padding: 6px 8px; border-radius: 6px; background: #F6F7F9">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: {{c.nameFg}}">{{i.name}}</span>
              <span style="font-size: 12px; color: #5B6270">{{i.what}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="font-size: 14px; color: #4A515C">The FMC tool profile hides the last column so its descriptions don't load into every conversation. FMC_TOOL_PROFILE=full restores them.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
renderVals() {
const t = (name, what) => ({ name, what });
const cols = [
{ title: 'Formcraft tools', color: '#1F6FEB', nameFg: '#1556BD', rule: 'Dry run first; writes only to WIP and staging; every action in the log.', items: [
t('fmc_file list_open', 'Open documents and the active one'),
t('fmc_file create_from_template', 'New family, template or model'),
t('fmc_file save_as · close', 'Never a workshared model'),
t('fmc_file archive', 'Moves to _Archive; nothing deleted'),
t('fmc_family plan · build', 'Data-shell families from the specs'),
t('fmc_family load_test', 'Place, flex and check in a chain test')
] },
{ title: 'Read-only', color: '#1E8E3E', nameFg: '#1E6B34', rule: 'Work on every model, live projects included.', items: [
t('get_current_view_info', 'View name, type, scale'),
t('get_selected_elements', 'What the user picked'),
t('get_current_view_elements', 'Elements in the view'),
t('get_available_family_types', 'Loaded families and types'),
t('analyze_model_statistics', 'Counts by category'),
t('get_material_quantities', 'Areas and volumes'),
t('ai_element_filter', 'Find elements by rule')
] },
{ title: 'Model-changing', color: '#C77400', nameFg: '#6B4100', rule: 'Live-model lock: only on families, new files and library folders.', items: [
t('create_*', 'Elements, levels, grids, rooms'),
t('create_dimensions', 'Dimensions in a view'),
t('operate_element', 'Move, hide, isolate, select'),
t('delete_element', 'Remove elements'),
t('send_code_to_revit', 'Run C# in the model')
] },
{ title: 'Hidden (FMC profile)', color: '#8A919C', nameFg: '#4A515C', rule: 'Not loaded unless the profile is set to full.', items: [
t('say_hello', 'Connection test dialog'),
t('color_elements', 'Colour by parameter'),
t('tag_all_walls · tag_all_rooms', 'Bulk tagging'),
t('store_* · query_stored_data', 'Local database'),
t('export_room_data', 'Room export'),
t('search_modules · use_module', 'Module loader')
] }
];
return { cols };
}
}
</script>
</body>
</html>
