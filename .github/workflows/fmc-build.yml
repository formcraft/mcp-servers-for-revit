name: FMC build (Revit 2025)

on:
  push:
    branches: [main, "fmc/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build the MCP server (TypeScript)
        working-directory: server
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath tsc.log
          if ($LASTEXITCODE -ne 0) { Get-Content tsc.log | Select-String "error TS" | ForEach-Object { Write-Output "::error::$_" }; exit 1 }

      - name: Test the guard rules
        working-directory: server
        run: npm test

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build plugin and command set for Revit 2025
        shell: pwsh
        run: |
          dotnet build mcp-servers-for-revit.sln -c "Release R25" 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { Get-Content build.log | Select-String ": error " | Select-Object -First 20 | ForEach-Object { Write-Output "::error::$_" }; exit 1 }

      - name: Package the Revit 2025 add-in
        shell: pwsh
        run: |
          $addin = Get-ChildItem -Directory -Path plugin\bin -Filter "AddIn 2025*" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item plugin\mcp-servers-for-revit.addin out\
          Copy-Item -Recurse "$($addin.FullName)\revit_mcp_plugin" out\
          Copy-Item fmc_guard.example.json out\
          New-Item -ItemType Directory -Force -Path out\server | Out-Null
          Copy-Item -Recurse server\build out\server\build
          Copy-Item server\package.json, server\package-lock.json out\server\

      - uses: actions/upload-artifact@v4
        with:
          name: fmc-revit2025-addin
          path: out
